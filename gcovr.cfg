# gcovr configuration for host-error-monitor
# https://gcovr.com/en/stable/guide/configuration.html

# Root directory for source files
root = .

# Include only production source files in coverage
filter = src/
filter = include/

# Exclude test code and third-party dependencies
exclude = tests/
exclude = subprojects/
exclude = build/

# Exclude system and external headers
exclude = /usr/
exclude = /tmp/

# Exclude lines matching these patterns
exclude-lines-by-pattern = .*LCOV_EXCL_LINE.*
exclude-lines-by-pattern = .*GCOVR_EXCL_LINE.*

# Exclude unreachable branches (compiler-generated)
exclude-unreachable-branches = yes

# Exclude throw branches
exclude-throw-branches = yes

# Sort output by uncovered lines (descending)
sort = uncovered-number

# Print summary to stdout
print-summary = yes
